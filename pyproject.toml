[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mx-harness"
version = "0.1.0"
description = "A lightweight, reproducible evaluation harness for GenAI applications"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp[cli]>=2,<3"]

[project.scripts]
mx-harness = "mx_harness.cli:main"

[tool.setuptools]
packages = ["mx_harness", "mcp_servers"]
