[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloe-agent"
version = "0.1.0"
description = "Offline prototype for evaluating personal-assistant task flows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp[cli]>=2,<3"]
dev = ["pytest>=8,<9"]

[project.scripts]
cloe-agent = "cloe_agent.cli:main"

[tool.setuptools]
packages = ["cloe_agent", "mcp_servers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
